[workspace]
resolver = "2"
members = [
    "crates/identifier",
    "crates/wit",
    "crates/wpt",
    "crates/httpsig",
    "crates/mtls",
    "crates/issuer",
    "crates/cli",
    "crates/demo",
    "crates/conformance",
]
# cargo-fuzz builds this with nightly and its own sanitizer flags; it must not
# be pulled into the workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/kanywst/wimsey"
homepage = "https://github.com/kanywst/wimsey"
authors = ["The wimsey authors"]
keywords = ["wimse", "workload-identity", "spiffe", "wit", "jose"]
categories = ["authentication", "cryptography"]

[workspace.dependencies]
wimsey-identifier = { path = "crates/identifier", version = "0.3.0" }
wimsey-wit = { path = "crates/wit", version = "0.3.0" }
wimsey-wpt = { path = "crates/wpt", version = "0.3.0" }
wimsey-httpsig = { path = "crates/httpsig", version = "0.3.0" }
wimsey-mtls = { path = "crates/mtls", version = "0.3.0" }
ed25519-dalek = "3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
strip = true
