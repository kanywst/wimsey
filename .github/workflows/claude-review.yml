name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Drafts are skipped until
    # they are marked ready, which is what the ready_for_review trigger is for.
    # Dependabot only ever bumps a version in Cargo.toml and Cargo.lock; none of
    # the five things below apply to it, so a review costs tokens to say nothing.
    # CI and cargo-deny are the checks that matter for a bump.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      # Everything the reviewer posts is timestamped after this, which is how the
      # last step tells this run's comments from an earlier push's.
      - name: Mark the start of the review
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            wimsey is a vendor-neutral Rust reference implementation of the IETF WIMSE
            workload identity specs: Workload Identity Tokens, proof of possession, RFC 9421
            HTTP message signatures, and mTLS. It is pre-alpha and pins specific
            Internet-Draft revisions in SPEC-MAP.md, with cross-implementation vectors under
            conformance/.

            Do not repeat what CI already does. clippy, rustfmt, the tests and cargo-deny
            run on this PR already.

            Look for what only a reader can catch:

            1. Spec drift. A behaviour change has to move SPEC-MAP.md and the conformance
               vectors with it, or the repo claims a draft revision it no longer matches.

            2. Vectors edited to pass. The conformance vectors are a contract other
               implementations validate against. Changing one so a test goes green inverts
               the reason they exist.

            3. RFC 9421 exactness. The signature base is built from a covered component
               list, its ordering, its parameters and canonicalisation. Changing any of them
               breaks interop while both sides still produce a valid-looking signature.

            4. Verification as the security boundary. A signature, expiry, audience or nonce
               check that can be skipped, and comparison of secret material that is not
               constant time.

            5. Rust specifics that matter for a library: unwrap or expect reachable from
               untrusted input, panics in library crates, and errors that leak key material.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # In practice the reviewer posts when it has a finding and stays silent
      # when it does not, whatever the prompt asks of it. Silence then means two
      # things at once — reviewed and clean, or died before it could speak — and
      # the pull request looks identical either way. The same green check, no
      # comment, for both. So say the quiet outcome out loud.
      #
      # This speaks as the workflow rather than as the reviewer, so a reader can
      # tell a machine-generated "nothing to say" from a review that said it.
      - name: Say so when the review found nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          # Both surfaces: a review can land as inline comments, as one
          # top-level comment, or as both.
          posted=$(
            {
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
                --jq '.[] | select(.user.login == "claude[bot]") | .created_at'
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                --jq '.[] | select(.user.login == "claude[bot]") | .created_at'
            } | awk -v since="$SINCE" '$0 >= since' | wc -l | tr -d ' '
          )
          if [ "$posted" -gt 0 ]; then
            echo "the reviewer posted $posted comment(s) on this run"
            exit 0
          fi

          # Silence has one more cause than "clean", and the note must not
          # claim a review happened when it did not: the action refuses to run
          # when this file differs from the copy on the base branch, so a pull
          # request touching the reviewer is never reviewed by it. Ask git
          # rather than guess.
          git fetch --quiet --depth=1 origin "$BASE"
          if git diff --quiet FETCH_HEAD HEAD -- .github/workflows/claude-review.yml; then
            body=$(printf '%s\n\n%s\n' \
              "Claude review ran against \`$SHA\` and posted no findings." \
              "Automated note from the workflow, not from the reviewer: it stays silent when it has nothing to report, so this tells a clean review apart from a run that never got to speak.")
          else
            body=$(printf '%s\n\n%s\n' \
              "Claude review did **not** run against \`$SHA\`." \
              "This pull request modifies \`.github/workflows/claude-review.yml\`, and the action refuses to run from a version of itself that differs from the base branch — a pull request cannot rewrite its own reviewer. Review these changes by hand; the next pull request gets the reviewer back.")
          fi
          # Keep exactly one of these, rewritten per push, instead of one per
          # push: the note is about the current head and nothing else.
          gh pr comment "$PR" --edit-last --body "$body" 2>/dev/null \
            || gh pr comment "$PR" --body "$body"
