name: Claude code review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A rapid re-push should supersede the in-flight review rather than post twice.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Advisory, not a gate. A reviewer that cannot reach the API (expired token, empty
    # credit balance, provider outage) says nothing about the change under review, so it
    # must not be what blocks a merge. Read the job log when the review is missing.
    continue-on-error: true
    # Dependabot bumps are lockfile-only, so reviewing them just burns tokens.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Keeps the job green (and silent) until the token is added to the repo secrets,
      # instead of turning every PR red with an auth failure. A pull request from a fork
      # cannot see the secret either, so this covers that case too.
      - name: Check for a token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${CLAUDE_CODE_OAUTH_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          # `claude setup-token` issues an OAuth token (sk-ant-oat01-...) that runs on the
          # Claude subscription. It is not an API key and is rejected by the x-api-key
          # header, so it has to go through this input rather than anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the working
            directory.

            wimsey is a vendor-neutral Rust reference implementation of the IETF WIMSE workload
            identity specs: Workload Identity Tokens, proof of possession, RFC 9421 HTTP message
            signatures, and mTLS. It is pre-alpha and pins specific Internet-Draft revisions in
            SPEC-MAP.md. Code lives in crates/{cli,httpsig,identifier,issuer,mtls,wit,wpt}, with
            cross-implementation vectors under conformance/.

            Focus on:
            - This is a reference implementation, so being right matters more than being convenient.
              A behaviour change has to move SPEC-MAP.md and the conformance vectors with it,
              otherwise the repo claims to implement a revision it no longer matches.
            - The conformance vectors are a contract other implementations validate against. Editing
              a vector to make a test pass inverts the point of having them.
            - RFC 9421 signature base construction is exact: covered component list, ordering,
              parameters and canonicalisation. A change to any of them breaks interop even though
              both sides still produce a signature.
            - Verification is the security boundary. Look for a signature, expiry, audience or
              nonce check that can be skipped, and for comparisons of secret material that are not
              constant time.
            - Rust specifics: no unwrap or expect on paths reachable from untrusted input, no panic
              in library crates, and errors that carry enough context to diagnose without leaking key
              material.

            Report only what you can point at in the diff. Do not restate what the change
            does, do not praise it, and skip nits that clippy would already catch. If the
            change looks sound, say so in one line rather than inventing findings.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to point at specific lines.
            Only post GitHub comments, do not return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
