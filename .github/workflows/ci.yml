name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: check / clippy / fmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      - name: doctests
        run: cargo test --workspace --doc
      - name: end-to-end demo
        run: cargo run -q -p wimsey-demo
      - name: conformance suite
        run: cargo run -q -p wimsey-conformance -- run --dir conformance
      - name: conformance vectors are fresh
        run: |
          cargo run -q -p wimsey-conformance -- generate --out conformance
          git diff --exit-code conformance/

  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-latest
    env:
      # The workspace-wide `-D warnings` would be appended to cargo-fuzz's own
      # sanitizer RUSTFLAGS, turning a warning anywhere in the dependency tree
      # into a failed fuzz build. The workspace lints are enforced by the `test`
      # job; this one is about the parsers.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      # libFuzzer's instrumentation needs the nightly sanitizer flags; the rest
      # of the workspace stays on stable.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: seed the corpus from the conformance vectors
        run: ./fuzz/seed-corpus.sh
      # A short run per target. This is a regression gate, not a hunt: it is
      # long enough to catch a parser that panics on something the vectors
      # already cover, and short enough that nobody starts skipping CI. Finding
      # new bugs is what the long local runs in fuzz/README.md are for.
      - name: fuzz
        run: |
          set -euo pipefail
          for target in identifier_parse wit_verify wpt_verify httpsig_verify wic_parse; do
            echo "::group::$target"
            # rust-toolchain.toml pins the workspace to stable, and libFuzzer's
            # `-Zsanitizer` needs nightly, so the override is not optional here.
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -print_final_stats=1
            echo "::endgroup::"
          done
      - name: report any crash
        if: failure()
        run: |
          for dir in fuzz/artifacts/*/; do
            for artifact in "$dir"*; do
              [ -e "$artifact" ] || continue
              echo "::error::crash artifact $artifact"
              xxd "$artifact" | head -20
            done
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on PR commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base".."$head"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line"
              missing=1
            fi
          done
          exit $missing
