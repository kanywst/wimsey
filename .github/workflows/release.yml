name: release

on:
  push:
    tags: ["v*"]
  # Re-run against a tag that already exists: to retry a release whose publish
  # stage failed halfway, or to attach artifacts to an older tag. Every step
  # below is idempotent, so a re-run replaces assets rather than duplicating
  # them.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag matches the tree
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false
      - name: the tag, the workspace version and the changelog must agree
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "wimsey-cli") | .version')
          if [ "$want" != "$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p wimsey-cli --target ${{ matrix.target }}
      - name: package
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          TARGET: ${{ matrix.target }}
          # Keep bsdtar from smuggling macOS extended attributes into the tarball.
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          name="wimsey-$TAG-$TARGET"
          mkdir -p "staging/$name"
          cp "target/$TARGET/release/wimsey" "staging/$name/"
          cp LICENSE README.md CHANGELOG.md "staging/$name/"
          tar -czf "$name.tar.gz" -C staging "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wimsey-${{ matrix.target }}
          path: wimsey-*.tar.gz
          if-no-files-found: error

  publish:
    name: sign and publish
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Keyless signing and provenance both mint an OIDC token.
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      # The tag's tree, and the only thing the SBOM describes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          path: source
          persist-credentials: false
      # The release-notes template has to come from the workflow's own ref
      # instead: back-filling an older tag must not depend on that tag having
      # shipped the template, which by definition it did not. It sits beside the
      # source tree rather than inside it — syft catalogues `.github/workflows`,
      # so a nested checkout would put this branch's actions into a release SBOM
      # for an older tag.
      - uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wimsey-*
          merge-multiple: true

      - name: software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: source
          format: spdx-json
          output-file: dist/wimsey-${{ needs.guard.outputs.tag }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign every asset
        run: |
          set -euo pipefail
          cd dist
          # Keyless: the certificate binds the signature to this workflow at this
          # tag, so there is no long-lived key to leak or rotate. The signature
          # and that certificate travel together in one Sigstore bundle; cosign
          # v4 deprecated the separate --output-signature/--output-certificate
          # pair and ignores them.
          for file in *.tar.gz *.spdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          ls -1

      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Neither checkout lands at the workspace root any more, so there is no
          # git remote for gh to infer the repository from. Say it explicitly.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          # The identity Sigstore actually bound the signature to. It follows the
          # ref the *workflow* ran from, which is the tag on a tag push but the
          # default branch on a dispatched back-fill — so it has to be read off
          # github.ref rather than assumed to be the tag, or the published
          # command tells people to check something that was never signed.
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

          # Tell people how to check the signatures on the page where they are
          # downloading the thing. Instructions nobody sees protect nobody.
          #
          # Rewritten on every run rather than appended once, because a re-run
          # re-signs the assets and the identity Sigstore binds them to follows
          # the ref the workflow ran from. A dispatched run therefore replaces
          # tag-signed assets with main-signed ones, and notes left alone would
          # go on naming an identity nothing was signed with — instructions that
          # fail for every person who follows them.
          gh release view "$TAG" --json body -q .body > notes.md
          awk '/^## Verifying this release$/{exit} {print}' notes.md > notes.trimmed
          mv notes.trimmed notes.md
          # Substituted with bash parameter expansion, not sed: a ref name may
          # legally contain `&` or `|`, which sed would respectively swallow
          # into the match and mistake for its own delimiter. Publishing a
          # subtly wrong identity is the exact failure this step exists to
          # prevent.
          template=$(cat workflow/.github/release-notes-verification.md)
          template=${template//__TAG__/$TAG}
          template=${template//__REPO__/$REPO}
          template=${template//__IDENTITY__/$IDENTITY}
          printf '\n%s\n' "$template" >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  crates-io:
    name: publish to crates.io
    # Last, and only if the release itself succeeded. A crates.io version can be
    # yanked but never deleted, and the name is taken forever, so nothing reaches
    # the registry until the tag has produced signed, verified artifacts.
    needs: [guard, publish]
    runs-on: ubuntu-latest
    # Gives the publish somewhere to hang a required-reviewer rule, so the one
    # irreversible step in this workflow can be held for a human.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: the registry token must be configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; add it under Settings > Secrets"
            exit 1
          fi
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # `--workspace` walks the crates in dependency order and waits for each
        # to land on the index before the next one resolves it, which is the part
        # that is tedious and easy to get wrong by hand. The three crates marked
        # `publish = false` are skipped by cargo itself, so the decision to hold
        # `wimsey-issuer` back lives in its manifest and cannot be lost here.
        #
        # What cargo will not do is skip a member it has already uploaded, so a
        # run that dies partway — crates.io rate-limits *new* crates, and the
        # first release of a workspace walks straight into that — cannot simply
        # be re-run. Excluding what is already on the index makes the job
        # idempotent, so finishing an interrupted release is one re-run rather
        # than a hand-driven sequence of `cargo publish -p`.
        run: |
          set -euo pipefail
          excludes=()
          pending=0
          while read -r name version; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: wimsey-release (https://github.com/kanywst/wimsey)' \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$code" in
              200) echo "already published: $name $version"
                   excludes+=(--exclude "$name") ;;
              404) echo "to publish:        $name $version"
                   pending=$((pending + 1)) ;;
              *)   echo "::error::crates.io returned $code for $name $version"
                   exit 1 ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"')

          if [ "$pending" -eq 0 ]; then
            echo "every publishable crate is already on crates.io; nothing to do"
            exit 0
          fi
          if ! cargo publish --workspace --locked "${excludes[@]}"; then
            # A 403 here is almost always the token's scopes rather than the
            # code: `publish-new` alone is enough for a first release, when
            # every crate is new, and then fails on the next one.
            echo "::error::publish failed. On a 403, check that CARGO_REGISTRY_TOKEN carries both publish-new and publish-update: a release that adds a crate needs both at once."
            exit 1
          fi

  homebrew:
    name: publish the formula to kanywst/homebrew-tap
    # After publish, never beside it: the formula pins a sha256 per archive, so
    # it must be derived from the SHA256SUMS the release actually carries rather
    # than from a local build that merely ought to match. Independent of
    # crates-io — a held crates.io review must not also hold up the tap.
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      # The formula is committed to another repository with a PAT. Nothing in
      # this job writes to this one.
      contents: read
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      # Fail here rather than three steps later against the tap's API, where the
      # error is a 404 that reads like the repository is missing.
      - name: the tap token must be configured
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set. Mint a fine-grained PAT scoped to kanywst/homebrew-tap with Contents: read and write, then: gh secret set HOMEBREW_TAP_GITHUB_TOKEN"
            exit 1
          fi

      - name: read the published checksums
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The checksums come from the release rather than from the build job's
        # artifacts so that a dispatched back-fill, which re-signs and re-uploads,
        # writes a formula describing the assets that are actually downloadable.
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS --output SHA256SUMS --clobber
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            file="wimsey-$TAG-$target.tar.gz"
            # Anchored on the whole filename: an unanchored grep for the target
            # also matches the aarch64 line when looking for x86_64 is not a
            # risk, but it does match longer names, and a formula that pins the
            # wrong checksum fails at install time with nothing pointing here.
            sum=$(awk -v f="./$file" '$2 == f { print $1 }' SHA256SUMS)
            if [ -z "$sum" ]; then
              echo "::error::SHA256SUMS has no entry for $file"
              exit 1
            fi
            echo "${target//-/_}=$sum" >> "$GITHUB_OUTPUT"
          done

      - name: write the formula and push it
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION_SHA_AARCH64_DARWIN: ${{ steps.sums.outputs.aarch64_apple_darwin }}
          VERSION_SHA_X86_64_DARWIN: ${{ steps.sums.outputs.x86_64_apple_darwin }}
          VERSION_SHA_AARCH64_LINUX: ${{ steps.sums.outputs.aarch64_unknown_linux_gnu }}
          VERSION_SHA_X86_64_LINUX: ${{ steps.sums.outputs.x86_64_unknown_linux_gnu }}
        # Written through the contents API rather than a clone and push. The tap
        # takes direct pushes from four other release pipelines, and a clone plus
        # push races them; the API's `sha` parameter turns that race into a
        # rejected write we can see instead of a silent overwrite.
        run: |
          set -euo pipefail

          # No `version` stanza: Homebrew scans it out of the url, `brew audit`
          # rejects declaring it twice, and the scan was checked against both
          # `v0.6.2` and a `v0.7.0-rc.1` shaped prerelease.
          #
          # The two sigils are not decoration: `brew style` runs RuboCop with
          # Homebrew's config, which fails a formula that has neither a Sorbet
          # sigil nor a frozen-string-literal comment. GoReleaser emits the same
          # pair at the top of every formula it writes into this tap.
          cat > wimsey.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file was generated by kanywst/wimsey .github/workflows/release.yml. DO NOT EDIT.
          class Wimsey < Formula
            desc "Issue, verify and inspect WIMSE workload identity credentials"
            homepage "https://github.com/kanywst/wimsey"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/kanywst/wimsey/releases/download/$TAG/wimsey-$TAG-aarch64-apple-darwin.tar.gz"
                sha256 "$VERSION_SHA_AARCH64_DARWIN"
              end
              on_intel do
                url "https://github.com/kanywst/wimsey/releases/download/$TAG/wimsey-$TAG-x86_64-apple-darwin.tar.gz"
                sha256 "$VERSION_SHA_X86_64_DARWIN"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/kanywst/wimsey/releases/download/$TAG/wimsey-$TAG-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$VERSION_SHA_AARCH64_LINUX"
              end
              on_intel do
                url "https://github.com/kanywst/wimsey/releases/download/$TAG/wimsey-$TAG-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$VERSION_SHA_X86_64_LINUX"
              end
            end

            def install
              bin.install "wimsey"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/wimsey --version")
            end
          end
          EOF

          path=Formula/wimsey.rb
          # An update needs the blob sha of what it replaces; a first release has
          # nothing to replace and must not send one.
          sha=$(gh api "repos/kanywst/homebrew-tap/contents/$path" --jq .sha 2>/dev/null || true)
          args=(
            --method PUT
            -f "message=chore(wimsey): bump to $TAG"
            -f "content=$(base64 -w0 < wimsey.rb)"
            -f "branch=main"
            -f "committer[name]=github-actions[bot]"
            -f "committer[email]=41898282+github-actions[bot]@users.noreply.github.com"
          )
          if [ -n "$sha" ]; then
            args+=(-f "sha=$sha")
          fi
          gh api "repos/kanywst/homebrew-tap/contents/$path" "${args[@]}" --jq .commit.html_url
