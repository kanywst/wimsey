name: release

on:
  push:
    tags: ["v*"]
  # Re-run against a tag that already exists: to retry a release whose publish
  # stage failed halfway, or to attach artifacts to an older tag. Every step
  # below is idempotent, so a re-run replaces assets rather than duplicating
  # them.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag matches the tree
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false
      - name: the tag, the workspace version and the changelog must agree
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "wimsey-cli") | .version')
          if [ "$want" != "$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p wimsey-cli --target ${{ matrix.target }}
      - name: package
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          TARGET: ${{ matrix.target }}
          # Keep bsdtar from smuggling macOS extended attributes into the tarball.
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          name="wimsey-$TAG-$TARGET"
          mkdir -p "staging/$name"
          cp "target/$TARGET/release/wimsey" "staging/$name/"
          cp LICENSE README.md CHANGELOG.md "staging/$name/"
          tar -czf "$name.tar.gz" -C staging "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wimsey-${{ matrix.target }}
          path: wimsey-*.tar.gz
          if-no-files-found: error

  publish:
    name: sign and publish
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Keyless signing and provenance both mint an OIDC token.
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wimsey-*
          merge-multiple: true

      - name: software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/wimsey-${{ needs.guard.outputs.tag }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign every asset
        run: |
          set -euo pipefail
          cd dist
          # Keyless: the certificate binds the signature to this workflow at this
          # tag, so there is no long-lived key to leak or rotate.
          for file in *.tar.gz *.spdx.json SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "$file.sig" \
              --output-certificate "$file.pem" \
              "$file"
          done
          ls -1

      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

          # Tell people how to check the signatures on the page where they are
          # downloading the thing. Instructions nobody sees protect nobody.
          gh release view "$TAG" --json body -q .body > notes.md
          if ! grep -q '^## Verifying this release$' notes.md; then
            printf '\n' >> notes.md
            sed -e "s|__TAG__|$TAG|g" -e "s|__REPO__|$REPO|g" \
              .github/release-notes-verification.md >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
