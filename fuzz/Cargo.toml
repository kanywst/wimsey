[package]
name = "wimsey-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Not a workspace member: cargo-fuzz builds it with its own profile and
# sanitizer flags, and it must not drag the workspace onto nightly.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
wimsey-identifier = { path = "../crates/identifier" }
wimsey-wit = { path = "../crates/wit" }
wimsey-wpt = { path = "../crates/wpt" }
wimsey-httpsig = { path = "../crates/httpsig" }
wimsey-mtls = { path = "../crates/mtls" }

[[bin]]
name = "identifier_parse"
path = "fuzz_targets/identifier_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wit_verify"
path = "fuzz_targets/wit_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wpt_verify"
path = "fuzz_targets/wpt_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "httpsig_verify"
path = "fuzz_targets/httpsig_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wic_parse"
path = "fuzz_targets/wic_parse.rs"
test = false
doc = false
bench = false
