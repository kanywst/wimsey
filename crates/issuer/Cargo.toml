[package]
name = "wimsey-issuer"
description = "Experimental WIMSE credential issuer with a SPIFFE Workload API shim."
readme = "README.md"
# Held back from crates.io deliberately. This issuer performs no workload
# attestation at all — it mints a WIT for anyone who asks — so publishing it
# would put `cargo install wimsey-issuer` one command away from a running,
# unauthenticated credential minter, for someone who never read the warning.
# The warning belongs in front of the reader, not behind an install.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "wimsey-issuer"
path = "src/main.rs"

[dependencies]
wimsey-identifier = { workspace = true }
wimsey-wit = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
