[package]
name = "wimsey-mtls"
description = "WIMSE workload authentication using mutual TLS (client cert = WIC)."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
wimsey-identifier = { workspace = true }
wimsey-jose = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "ring",
    # Needed to certify a public key the workload generated itself: it is what
    # provides `SubjectPublicKeyInfo::from_der`. x509-parser is already a direct
    # dependency of this crate, so this adds no new supply chain surface.
    "x509-parser",
] }
x509-parser = "0.18"
time = "0.3"

[lints]
workspace = true
